name: deploy-docs

on:
  release:
    types: [published]
  workflow_dispatch:
permissions: {}
jobs:
  deploy-docs:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
        with:
          python-version: "3.14"
      - name: Install Poetry with pipx
        run: pipx install poetry
      - name: Install dependencies with poetry
        run: poetry install --no-root
      - name: Get version number
        run: echo "VERSION=$(poetry version -s | cut -d. -f1,2)" >> $GITHUB_ENV
      - name: Deploy docs to GitHub pages site
        env:
          github-token: ${{ secrets.GITHUB_TOKEN}}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          poetry run git fetch origin gh-pages --depth=1
          poetry run mike deploy ${VERSION} latest --update-aliases --push
          poetry run mike set-default ${VERSION} --push